name: Dump game code

# Reads the "base" release APK, tries to dump the game's class/field names
# into dump.cs, and uploads the result as an artifact. No release is made.
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Get APK and the two files we need
        run: |
          gh release download base --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --output original.apk
          mkdir -p in out
          unzip -j -o original.apk lib/arm64-v8a/libil2cpp.so \
            assets/bin/Data/Managed/Metadata/global-metadata.dat -d in

      - name: Name list straight from the metadata (always works)
        run: |
          grep -a -o -E '[A-Za-z_][A-Za-z_0-9]{2,60}' in/global-metadata.dat \
            | grep -iE 'height|muscle|limit|clamp|slider|maxsize|scale' \
            | sort -u > out/names.txt || true

      - name: Try Il2CppDumper
        continue-on-error: true
        run: |
          mkdir tool
          gh release download --repo Perfare/Il2CppDumper --pattern 'Il2CppDumper-net8*' --dir tool \
            || gh release download --repo Perfare/Il2CppDumper --pattern 'Il2CppDumper-net6*' --dir tool
          cd tool && unzip -q -o ./*.zip
          sed -i 's/"RequireAnyKey": *true/"RequireAnyKey": false/' config.json
          dotnet Il2CppDumper.dll ../in/libil2cpp.so ../in/global-metadata.dat ../out \
            < /dev/null 2>&1 | tee ../out/log.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dump
          path: |
            out/dump.cs
            out/names.txt
            out/log.txt
          if-no-files-found: warn
